# launcher-material colours for herdr - rendered by Termux Launcher, do not edit.
#
# Both palettes, in the two subtables herdr layers on top of the shared
# [theme.custom] overrides when [theme] auto_switch is on: it picks the one
# matching the light/dark appearance the host terminal reports. apply.sh
# splices these into ~/.config/herdr/config.toml.
#
# Backgrounds are "reset" so the launcher glass shows through. herdr draws the
# active tab label in panel_bg, so with a clear tab bar the accent is a mid tone.

[theme.custom.dark]
accent        = "{{ colors.inverse_primary.dark.hex }}"
panel_bg      = "reset"
sidebar_bg    = "reset"
active_row_bg = "{{ colors.primary_container.dark.hex }}"
selection_bg  = "{{ colors.secondary_container.dark.hex }}"
surface0      = "{{ colors.surface_container_highest.dark.hex }}"
surface1      = "{{ colors.surface_bright.dark.hex }}"
surface_dim   = "reset"
overlay0      = "{{ colors.secondary.dark.hex }}"
overlay1      = "{{ colors.primary.dark.hex }}"
text          = "{{ colors.inverse_surface.dark.hex }}"
subtext0      = "{{ colors.on_surface.dark.hex }}"
mauve         = "{{ colors.terminal_bright_magenta.dark.hex }}"
green         = "{{ colors.terminal_normal_green.dark.hex }}"
yellow        = "{{ colors.terminal_bright_yellow.dark.hex }}"
red           = "{{ colors.terminal_bright_red.dark.hex }}"
blue          = "{{ colors.terminal_bright_blue.dark.hex }}"
teal          = "{{ colors.terminal_bright_cyan.dark.hex }}"
peach         = "{{ colors.terminal_normal_yellow.dark.hex }}"

[theme.custom.light]
accent        = "{{ colors.primary_container.light.hex }}"
panel_bg      = "reset"
sidebar_bg    = "reset"
active_row_bg = "{{ colors.primary_container.light.hex }}"
selection_bg  = "{{ colors.secondary_container.light.hex }}"
surface0      = "{{ colors.surface_container_highest.light.hex }}"
surface1      = "{{ colors.surface_bright.light.hex }}"
surface_dim   = "reset"
overlay0      = "{{ colors.outline.light.hex }}"
overlay1      = "{{ colors.primary.light.hex }}"
text          = "{{ colors.on_surface.light.hex }}"
subtext0      = "{{ colors.on_surface_variant.light.hex }}"
mauve         = "{{ colors.terminal_normal_magenta.light.hex }}"
green         = "{{ colors.terminal_normal_green.light.hex }}"
yellow        = "{{ colors.terminal_normal_yellow.light.hex }}"
red           = "{{ colors.terminal_normal_red.light.hex }}"
blue          = "{{ colors.terminal_normal_blue.light.hex }}"
teal          = "{{ colors.terminal_normal_cyan.light.hex }}"
peach         = "{{ colors.terminal_bright_yellow.light.hex }}"
